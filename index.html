<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Cafe - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-stone-950 text-white min-h-screen p-4 md:p-6">

    <!-- HEADER -->
    <header class="flex justify-between items-center pb-6 border-b border-stone-800">
        <div>
            <h1 class="text-xl font-black text-amber-400">Demo Cafe — Real-Time Admin</h1>
            <p class="text-xs text-stone-400">Live Kitchen Display & Menu Manager</p>
        </div>
        <div class="flex gap-2">
            <button onclick="playAlarmSound()" class="px-3.5 py-2 bg-stone-900 border border-amber-500/30 text-amber-400 font-bold rounded-xl text-xs shadow-md">🔊 Enable Alarm</button>
            <button onclick="openDishModal()" class="px-4 py-2 bg-amber-500 text-stone-950 font-bold rounded-xl text-xs shadow-lg">+ Add Dish</button>
        </div>
    </header>

    <!-- LIVE ORDERS QUEUE -->
    <main class="mt-6 space-y-4">
        <h2 class="text-xs font-bold text-amber-400/80 uppercase tracking-widest">🔔 Live Customer Orders Queue</h2>
        <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </main>

    <!-- MANAGE MENU ITEMS -->
    <section class="mt-10 space-y-4 pt-6 border-t border-stone-800">
        <h2 class="text-xs font-bold text-stone-400 uppercase tracking-widest">📜 Current Menu Items</h2>
        <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- ADD DISH MODAL -->
    <div id="dishModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-stone-900 border border-stone-800 p-6 rounded-3xl w-full max-w-sm space-y-3.5 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-white">Add New Dish</h3>
                <button onclick="closeDishModal()" class="text-stone-400 font-bold hover:text-white">✕</button>
            </div>
            <input type="text" id="dishName" placeholder="Dish Name (e.g. Cold Coffee)" class="w-full p-3 bg-stone-950 border border-stone-800 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
            <input type="number" id="dishPrice" placeholder="Price in ₹ (e.g. 120)" class="w-full p-3 bg-stone-950 border border-stone-800 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
            <input type="text" id="dishImg" placeholder="Image URL (Unsplash or Direct Link)" class="w-full p-3 bg-stone-950 border border-stone-800 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
            <button onclick="saveDishToFirebase()" class="w-full py-3 bg-amber-500 text-stone-950 font-bold rounded-xl text-xs shadow-lg">Save Dish to Menu</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeZq246X-z908x-Il0F-m86c1DaTXlgI4",
            authDomain: "fir-cafe-bd31f.firebaseapp.com",
            databaseURL: "https://fir-cafe-bd31f-default-rtdb.firebaseio.com",
            projectId: "fir-cafe-bd31f",
            storageBucket: "fir-cafe-bd31f.firebasestorage.app",
            messagingSenderId: "277510970587",
            appId: "1:277510970587:web:3836a5c62df85e26df00fe"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audioCtx = null;
        let isInitialLoad = true;

        document.addEventListener('DOMContentLoaded', () => {
            // Listen to Live Orders
            db.ref('orders').on('value', (snapshot) => {
                const data = snapshot.val();
                renderOrders(data);
                if(!isInitialLoad && data) {
                    playAlarmSound();
                }
                isInitialLoad = false;
            });

            // Listen to Live Menu
            db.ref('menu').on('value', (snapshot) => {
                const data = snapshot.val();
                renderAdminMenu(data);
            });
        });

        function renderOrders(ordersData) {
            const grid = document.getElementById('ordersGrid');
            grid.innerHTML = '';
            if(!ordersData) {
                grid.innerHTML = `<p class="text-xs text-stone-500">अभी कोई नया आर्डर नहीं आया है...</p>`;
                return;
            }

            Object.keys(ordersData).forEach(key => {
                const order = ordersData[key];
                if(order.status === 'PAID') return;

                let itemsList = order.items.map(i => `<li class="flex justify-between"><span>${i.qty}x ${i.name}</span><span>₹${i.price * i.qty}</span></li>`).join('');

                grid.innerHTML += `
                    <div class="bg-stone-900 border border-amber-500/30 p-4 rounded-2xl space-y-3 shadow-xl">
                        <div class="flex justify-between items-center font-extrabold text-amber-400 text-xs">
                            <span class="bg-amber-500/20 px-2 py-1 rounded-lg">TABLE #${order.tableNo}</span>
                            <span>${order.orderId}</span>
                        </div>
                        <div class="text-xs text-stone-300 space-y-1">
                            <p class="font-bold text-white">Guest: ${order.customerName} (${order.customerPhone})</p>
                            <ul class="mt-2 space-y-1 bg-stone-950 p-2.5 rounded-xl text-stone-300">${itemsList}</ul>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-stone-800">
                            <span class="text-xs font-normal text-stone-400">Total Bill:</span>
                            <span class="text-base font-black text-emerald-400">₹${order.total}</span>
                        </div>
                        <button onclick="markPaid('${key}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-colors">Mark Paid & Complete ✓</button>
                    </div>
                `;
            });
        }

        function renderAdminMenu(menuData) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            if(!menuData) {
                grid.innerHTML = `<p class="text-xs text-stone-500">मेनू खाली है। '+ Add Dish' पर क्लिक करके डिश जोड़ें।</p>`;
                return;
            }

            Object.keys(menuData).forEach(key => {
                const item = menuData[key];
                const isAvailable = item.inStock !== false;

                grid.innerHTML += `
                    <div class="bg-stone-900 border border-stone-800 p-3.5 rounded-2xl flex justify-between items-center text-xs">
                        <div class="flex items-center gap-3">
                            <img src="${item.img || 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=100'}" class="w-10 h-10 object-cover rounded-xl">
                            <div>
                                <p class="font-bold text-white">${item.name}</p>
                                <p class="text-amber-400 font-black">₹${item.price}</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleStock('${key}', ${!isAvailable})" class="px-2.5 py-1.5 ${isAvailable ? 'bg-stone-800 text-amber-400' : 'bg-emerald-600 text-white'} rounded-xl font-bold">
                                ${isAvailable ? 'Out of Stock' : 'In Stock'}
                            </button>
                            <button onclick="deleteDish('${key}')" class="px-2 py-1.5 bg-red-950 text-red-400 rounded-xl font-bold">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function openDishModal() { document.getElementById('dishModal').classList.remove('hidden'); }
        function closeDishModal() { document.getElementById('dishModal').classList.add('hidden'); }

        function saveDishToFirebase() {
            const name = document.getElementById('dishName').value;
            const price = parseInt(document.getElementById('dishPrice').value);
            const img = document.getElementById('dishImg').value || "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300";

            if(!name || !price) return alert("कृपया नाम और रेट डालें!");

            db.ref('menu').push({
                name: name,
                price: price,
                img: img,
                inStock: true
            });

            closeDishModal();
            document.getElementById('dishName').value = '';
            document.getElementById('dishPrice').value = '';
            document.getElementById('dishImg').value = '';
        }

        function toggleStock(key, newStatus) { db.ref(`menu/${key}`).update({ inStock: newStatus }); }
        function deleteDish(key) { if(confirm("डिश हटाना चाहते हैं?")) db.ref(`menu/${key}`).remove(); }
        function markPaid(key) { db.ref(`orders/${key}`).update({ status: 'PAID' }); }

        function playAlarmSound() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e){}
        }
    </script>
</body>
</html>
