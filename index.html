<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Cafe - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FIREBASE REALTIME DB SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-stone-950 text-white min-h-screen p-6">

    <header class="flex justify-between items-center pb-6 border-b border-stone-800">
        <div>
            <h1 class="text-xl font-black text-amber-400">Demo Cafe — Real-Time Admin</h1>
            <p class="text-xs text-stone-400">Live Kitchen Display & Menu Manager</p>
        </div>
        <div class="flex gap-2">
            <button onclick="playSirenSound()" class="px-3 py-2 bg-stone-800 text-amber-400 font-bold rounded-xl text-xs">🔊 Enable Alarm</button>
            <button onclick="openDishModal()" class="px-4 py-2 bg-amber-500 text-stone-950 font-bold rounded-xl text-xs">+ Add Dish</button>
        </div>
    </header>

    <!-- LIVE ORDERS QUEUE -->
    <main class="mt-6 space-y-4">
        <h2 class="text-sm font-bold text-stone-400 uppercase tracking-wider">Live Customer Orders</h2>
        <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </main>

    <!-- MANAGE MENU ITEMS -->
    <section class="mt-10 space-y-4">
        <h2 class="text-sm font-bold text-stone-400 uppercase tracking-wider">Current Cafe Menu</h2>
        <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- ADD DISH MODAL -->
    <div id="dishModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 border border-stone-800 p-6 rounded-3xl w-full max-w-sm space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg">Add New Dish</h3>
                <button onclick="closeDishModal()" class="text-stone-400 font-bold">✕</button>
            </div>
            <input type="text" id="dishName" placeholder="Dish Name (e.g. Cold Coffee)" class="w-full p-3 bg-stone-950 border border-stone-800 rounded-xl text-xs text-white">
            <input type="number" id="dishPrice" placeholder="Price (₹)" class="w-full p-3 bg-stone-950 border border-stone-800 rounded-xl text-xs text-white">
            <input type="text" id="dishImg" placeholder="Image URL (Unsplash or direct link)" class="w-full p-3 bg-stone-950 border border-stone-800 rounded-xl text-xs text-white">
            <button onclick="saveDishToFirebase()" class="w-full py-3 bg-amber-500 text-stone-950 font-bold rounded-xl text-xs">Save Dish to Menu</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeZq246X-z908x-Il0F-m86c1DaTXlgI4",
            authDomain: "fir-cafe-bd31f.firebaseapp.com",
            databaseURL: "https://fir-cafe-bd31f-default-rtdb.firebaseio.com",
            projectId: "fir-cafe-bd31f",
            storageBucket: "fir-cafe-bd31f.firebasestorage.app",
            messagingSenderId: "277510970587",
            appId: "1:277510970587:web:3836a5c62df85e26df00fe",
            measurementId: "G-YH34524HLJ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audioCtx = null;

        document.addEventListener('DOMContentLoaded', () => {
            db.ref('orders').on('value', (snapshot) => {
                const data = snapshot.val();
                renderOrders(data);
                playSirenSound();
            });

            db.ref('menu').on('value', (snapshot) => {
                const data = snapshot.val();
                renderAdminMenu(data);
            });
        });

        function renderOrders(ordersData) {
            const grid = document.getElementById('ordersGrid');
            grid.innerHTML = '';
            if(!ordersData) {
                grid.innerHTML = `<p class="text-xs text-stone-500">No active orders right now.</p>`;
                return;
            }

            Object.keys(ordersData).forEach(key => {
                const order = ordersData[key];
                if(order.status === 'PAID') return;

                let itemsText = order.items.map(i => `${i.qty}x ${i.name}`).join(', ');

                grid.innerHTML += `
                    <div class="bg-stone-900 border border-stone-800 p-4 rounded-2xl space-y-2">
                        <div class="flex justify-between font-bold text-amber-400 text-xs">
                            <span>TABLE #${order.tableNo}</span>
                            <span>${order.orderId}</span>
                        </div>
                        <p class="text-xs text-stone-300 font-semibold">${itemsText}</p>
                        <p class="text-sm font-black text-white">₹${order.total}</p>
                        <button onclick="markPaid('${key}')" class="w-full py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs">Mark Paid & Complete</button>
                    </div>
                `;
            });
        }

        function renderAdminMenu(menuData) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            if(!menuData) {
                grid.innerHTML = `<p class="text-xs text-stone-500">Menu is empty. Click '+ Add Dish' to add items.</p>`;
                return;
            }

            Object.keys(menuData).forEach(key => {
                const item = menuData[key];
                const isAvailable = item.inStock !== false;

                grid.innerHTML += `
                    <div class="bg-stone-900 border border-stone-800 p-3 rounded-2xl flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-white">${item.name}</p>
                            <p class="text-amber-400 font-black">₹${item.price}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleStock('${key}', ${!isAvailable})" class="px-3 py-1.5 ${isAvailable ? 'bg-stone-800 text-amber-400' : 'bg-emerald-600 text-white'} rounded-xl font-bold">
                                ${isAvailable ? 'Out of Stock' : 'Make Available'}
                            </button>
                            <button onclick="deleteDish('${key}')" class="px-2 py-1.5 bg-red-950 text-red-400 rounded-xl font-bold">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function openDishModal() { document.getElementById('dishModal').classList.remove('hidden'); }
        function closeDishModal() { document.getElementById('dishModal').classList.add('hidden'); }

        function saveDishToFirebase() {
            const name = document.getElementById('dishName').value;
            const price = parseInt(document.getElementById('dishPrice').value);
            const img = document.getElementById('dishImg').value || "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300";

            if(!name || !price) return alert("Please enter Name and Price!");

            const newDishRef = db.ref('menu').push();
            newDishRef.set({
                id: Date.now(),
                name: name,
                price: price,
                img: img,
                inStock: true
            });

            closeDishModal();
            document.getElementById('dishName').value = '';
            document.getElementById('dishPrice').value = '';
            document.getElementById('dishImg').value = '';
        }

        function toggleStock(key, newStatus) {
            db.ref(`menu/${key}`).update({ inStock: newStatus });
        }

        function deleteDish(key) {
            if(confirm("Delete this dish?")) db.ref(`menu/${key}`).remove();
        }

        function markPaid(key) {
            db.ref(`orders/${key}`).update({ status: 'PAID' });
        }

        function playSirenSound() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e){}
        }
    </script>
</body>
</html>
